name: release

# Publishing to npm WITH PROVENANCE, which is the whole reason this file exists and is
# separate from ci.yml.
#
# 🔴 Provenance cannot be produced from a laptop. Not "is awkward" — cannot. Measured
# against the code of the installed npm CLI (libnpmpublish/lib/publish.js): outside a
# supported CI provider it throws
#
#     Automatic provenance generation not supported for provider: <name>
#
# and inside GitHub Actions without the OIDC permission it throws
#
#     Provenance generation in GitHub Actions requires "write" access to the "id-token" permission
#
# `npm publish --provenance --dry-run` does NOT exercise any of that: the dry run skips
# provenance generation entirely and exits 0, so a green dry run proves nothing about
# whether provenance will be attached. That is why this workflow exists rather than a
# note saying "remember the flag".
#
# What provenance buys, stated plainly: a stranger can tie the published tarball to the
# commit and workflow that built it, instead of taking our word that the bytes in the
# registry came from the public source. For a product whose pitch is "check what is
# running", an unattested package is the same hole as an unsigned measurement table.
# Today the registry answers 404 for our attestations
# (/-/npm/v1/attestations/@usenami/signer-mcp@0.7.0) and the version metadata carries no
# `attestations` key.
#
# MANUAL ONLY. No push trigger, on purpose: publishing is a human decision, and the
# decision belongs to the person whose name is on the package.
#
# The run also needs an NPM_TOKEN secret. Measured 12.09: this repository has **0
# secrets**, so as written this workflow cannot publish anything even if someone runs it —
# the publish step would fail on authentication. Adding that secret is a repository-admin
# action and it is the real second lock. That is a feature of the current state, not an
# oversight to route around.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the version to publish, e.g. 0.8.0. It must match package.json.'
        required: true
        type: string
      # A rehearsal runs every guard, the build, the tests, the smoke check and the pack,
      # and publishes nothing. Default true, so the harmless run is the one you get by
      # pressing the button without thinking about it. Idea taken from PR #21, whose own
      # workflow file is otherwise superseded by this one.
      dry_run:
        description: 'Rehearse only — run everything and publish nothing.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # provenance: this is the permission whose absence throws the error above

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ Named so that a human gate CAN be attached, not because one exists. Measured
    # 12.09: this repository has 0 configured environments and 0 secrets. GitHub creates
    # a referenced environment on first run, so this line does not block anything by
    # itself — it blocks only once someone adds required reviewers to it. Saying that
    # plainly beats implying a protection that is not configured.
    environment: npm-publish
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      # ── Three refusals before anything leaves the machine ──
      #
      # Each one is a mistake that has actually happened to this package or to a sibling
      # repository, so none of them is hypothetical.
      # 🔴 A BRANCH MUST NOT BE ABLE TO PUBLISH. Found by a reviewer on PR #21 against its
      # own workflow, and it applies to this one word for word.
      #
      # `workflow_dispatch` lets the caller choose the ref, and the run then executes THAT
      # ref's copy of this file. Meanwhile `npm publish` runs the package's `prepare`
      # script — which here is `npm run build` — from the checked-out tree, with
      # NODE_AUTH_TOKEN in the environment. Put those together and anyone who can push a
      # branch can run their own code with the publish token. Version 0.8.0 went out from
      # `refs/heads/main` (its provenance says so), which is exactly the door being shut.
      #
      # So: tags only, and the tag has to name this version. A tag is also the thing a
      # repository CAN protect, which is where the rest of this belongs — tag protection
      # rules, or required reviewers on the environment below, or npm trusted publishing
      # instead of a long-lived token. Those are repository settings, not workflow code,
      # and they are not done: measured 12.09, this repository has 0 environments and 0
      # secrets beyond the publish token.
      - name: Publishing is allowed from a TAG only, and the tag must name this version
        if: ${{ inputs.dry_run == false }}
        run: |
          manifest="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "refusing: this run is on ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}', not a tag." >&2
            echo "npm publish runs the checked-out tree's prepare script with the publish" >&2
            echo "token in the environment, so a branch dispatch would run that branch's" >&2
            echo "code with the token. Publish from a tag:" >&2
            echo "    git tag v${manifest} && git push origin v${manifest}" >&2
            echo "then dispatch this workflow with that tag selected as the ref." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${manifest}" ]; then
            echo "refusing: the tag is '${GITHUB_REF_NAME}', the manifest says ${manifest}." >&2
            echo "Expected tag name: v${manifest}. Publishing a tag that names a different" >&2
            echo "version is how a release ends up untraceable to its own source." >&2
            exit 1
          fi
          echo "ref: tag ${GITHUB_REF_NAME} — matches the manifest"

      - name: The version you typed must be the version in the manifest
        run: |
          manifest="$(node -p "require('./package.json').version")"
          if [ "$manifest" != "${{ inputs.confirm }}" ]; then
            echo "refusing: you typed '${{ inputs.confirm }}', package.json says '$manifest'." >&2
            echo "One of the two is wrong, and publishing the other one is not a recovery." >&2
            exit 1
          fi
          echo "version: $manifest"

      - name: The CHANGELOG must describe THIS version, not the last one
        run: |
          manifest="$(node -p "require('./package.json').version")"
          top="$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)"
          if [ "$manifest" != "$top" ]; then
            echo "refusing: manifest is $manifest, the top CHANGELOG entry is $top." >&2
            echo "A release whose notes describe a different version is a release nobody can read." >&2
            exit 1
          fi
          echo "changelog top entry: $top"

      - name: That version must not already be in the registry
        run: |
          manifest="$(node -p "require('./package.json').version")"
          if npm view "@usenami/signer-mcp@$manifest" version >/dev/null 2>&1; then
            echo "refusing: $manifest is already published. npm versions are immutable;" >&2
            echo "bump the version rather than trying to replace one." >&2
            exit 1
          fi
          echo "$manifest is not in the registry yet"

      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: First start — boot the built server over stdio
        env:
          SIGNER_GATEWAY_URL: https://nonexistent.example.invalid
          SIGNER_API_TOKEN: sk_smoke_not_a_real_token
          SIGNER_FETCH_TIMEOUT_MS: "2000"
        run: npx tsx scripts/smoke-test.ts

      # What would actually go to the registry, printed before anything does. A reader of
      # the run can then see the file list rather than trusting that it was the right one.
      # Idea from PR #21.
      - name: What would go to the registry
        run: npm pack --dry-run

      - name: Publish with provenance
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Rehearsal — nothing was published
        if: ${{ inputs.dry_run != false }}
        run: |
          echo "::notice::Rehearsal. Guards, build, tests, smoke check and pack all ran; the registry was not touched."
          echo "For a real release: tag v$(node -p "require('./package.json').version"), push it, and dispatch this workflow on that tag with dry_run=false."


      # A publish that says it succeeded while the attestation is missing is exactly the
      # state we are trying to leave, so the run checks the registry rather than trusting
      # its own exit code.
      #
      # 🔴 TWO OUTCOMES, AND THEY MUST NOT SHARE A MESSAGE. The first version of this step
      # asked six times over one minute and then said "published, but could not confirm".
      # Measured on the 0.8.0 release (run 34694042383): indexing took longer than that,
      # the step went red, and two minutes later the provenance was there. Red was the
      # right call — a clean release must not be reported on an unconfirmed attestation —
      # but the wording collapsed two different facts:
      #
      #   * 200 with an EMPTY attestation list is an ANSWER. The registry knows this
      #     version and says there is no provenance. That means --provenance did not take
      #     effect (most likely the id-token permission) and the publish went out bare.
      #     Exit 1.
      #   * non-200 until the window runs out is a COULD-NOT-CONFIRM. The registry has not
      #     said anything about this version yet. The package is almost certainly fine and
      #     a human needs to look again in a few minutes. Exit 2.
      #
      # The window is now about eight minutes with a growing pause, and every attempt is
      # printed so the waiting is visible rather than looking like a hang.
      - name: Prove the provenance is actually there
        if: ${{ inputs.dry_run == false }}
        run: |
          manifest="$(node -p "require('./package.json').version")"
          # An empty manifest would build a URL without a version, which answers 404
          # forever — the check would then report "could not confirm" on every release and
          # look like registry lag. The guards above make that impossible today, and this
          # line means this step does not depend on them staying there.
          if [ -z "$manifest" ]; then
            echo "refusing: could not read a version out of package.json" >&2
            exit 2
          fi
          url="https://registry.npmjs.org/-/npm/v1/attestations/@usenami/signer-mcp@$manifest"
          waits="10 15 20 30 30 45 45 60 60 60 60 60"
          total=$(echo $waits | wc -w | tr -d ' ')
          attempt=0
          for pause in $waits; do
            attempt=$((attempt + 1))
            code="$(curl -s -o /tmp/att.json -w '%{http_code}' "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              # 🔴 THE BODY IS INSPECTED, NOT JUST THE STATUS. The first version asked node
              # for `attestations.length` with `|| echo 0` behind it, which turned three
              # different situations into two wrong answers: malformed JSON and a
              # non-array `attestations` both reported "the registry says there is no
              # provenance", and — the dangerous direction — a non-empty STRING has a
              # `.length`, so `{"attestations":"nope"}` would have gone down the SUCCESS
              # branch. A false green on the one check whose whole job is to prevent false
              # greens. Shape is now checked explicitly, and the three outcomes get three
              # exit codes.
              node -e "
                const fs = require('node:fs');
                let body;
                try { body = JSON.parse(fs.readFileSync('/tmp/att.json', 'utf8')); }
                catch { process.exit(4); }                    // not JSON at all
                const a = body && body.attestations;
                if (!Array.isArray(a)) process.exit(4);       // 200, but not the shape we know
                if (a.length === 0) process.exit(3);          // an answer: no provenance
                if (!a.every((x) => x && typeof x.predicateType === 'string')) process.exit(4);
                console.log('provenance is there: HTTP 200,', a.length, 'valid attestation(s)');
                for (const x of a) console.log('  predicateType:', x.predicateType);
                process.exit(0);
              " && exit 0
              shape=$?
              if [ "$shape" = "3" ]; then
                echo "🔴 NO PROVENANCE: the registry answered 200 for this version and the" >&2
                echo "   attestation list is EMPTY. That is an answer, not indexing lag: the" >&2
                echo "   publish went out without provenance — check the id-token permission." >&2
                exit 1
              fi
              # shape=4: a 200 we cannot read. Not evidence either way, so it is treated as
              # "not yet" and retried rather than announced as a verdict.
              echo "attempt ${attempt}: HTTP 200 but the body is not a readable attestation list — retrying"
            else
              echo "attempt ${attempt}: HTTP ${code} — not indexed yet"
            fi
            # Sleep only while another lookup remains. The first version slept after the
            # LAST attempt too: a full minute of waiting whose result was never read, and
            # provenance that indexed during it went unnoticed.
            if [ "$attempt" -lt "$total" ]; then
              echo "  waiting ${pause}s"
              sleep "$pause"
            fi
          done
          echo "⚠️ COULD NOT CONFIRM within the window (${attempt} attempts). This is NOT" >&2
          echo "   the same as 'no provenance': the registry never returned a readable" >&2
          echo "   attestation list, so it has said nothing usable about this version yet." >&2
          echo "   The package is most likely published. Check by hand once it indexes:" >&2
          echo "     curl -s ${url} | jq '.attestations[].predicateType'" >&2
          echo "   This run is red on purpose: a clean release must not be reported on an" >&2
          echo "   attestation nobody has seen." >&2
          exit 2
