name: verify

# This repository had no CI at all until 12 September 2026, which is how a tool that
# promised proof and verified nothing stayed in a published package: the tests that would
# have caught it did not exist, and the ones that did exist only ran when someone
# remembered. The attestation suite in particular is a falsification harness — it proves
# each named check CAN go red — and a harness nobody runs is a comment.
#
# Nothing here needs the network: the attestation fixture is a committed production
# extract, the gateway calls in tests are stubbed, and the forged-chain case mints its own
# CA with openssl at run time (which is why openssl matters on the runner, and ubuntu has
# it). So a red here is a real red rather than someone else's outage.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: types
        run: npx tsc --noEmit
      - name: tests, including the attestation falsifications
        run: npm test
